alias: Gerhard Hanloser  neuer Artikel
description: >-
  Benachrichtigt taeglich ueber neue Artikel von Gerhard Hanloser bei junge
  Welt. Optional kann beim manuellen Ausloesen date im Format DD.MM.YYYY
  uebergeben werden.
triggers:
  - trigger: time
    at: "23:59:00"
actions:
  - action: rest_command.jungewelt_gerhard_hanloser
    response_variable: resp
  - variables:
      html: "{{ resp.content if resp.content is string else resp.content | string }}"
      article_url: >-
        {% set matches = html |
        regex_findall('(?s)<li[^>]+id="a_[^"]+"[^>]*>.*?<div
        class="text-neutral-400 text-base">' ~ check_date ~ '</div>.*?<div
        class="text-3xl[^>]*"><a href="([^"]+)"[^>]*>(.*?)</a>') %} {% if
        matches %}
          {{ (matches | first)[0] }}
        {% endif %}
      article_title: >-
        {% set matches = html |
        regex_findall('(?s)<li[^>]+id="a_[^"]+"[^>]*>.*?<div
        class="text-neutral-400 text-base">' ~ check_date ~ '</div>.*?<div
        class="text-3xl[^>]*"><a href="([^"]+)"[^>]*>(.*?)</a>') %} {% if
        matches %}
          {{ (matches | first)[1] | regex_replace('<[^>]+>', '') | trim }}
        {% endif %}
  - condition: template
    value_template: "{{ article_url | trim != '' }}"
  - action: notify.signal_d44
    data:
      message: >-
        Neuer Artikel von Gerhard Hanloser, lesenswert: {{ article_title }}
        https://www.jungewelt.de{{ article_url }}
variables:
  check_date: "{{ date | default(now().strftime('%d.%m.%Y'), true) }}"
mode: single
