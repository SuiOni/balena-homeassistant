- alias: Karim El-Gawhary neue taz Artikel
  description: >-
    Benachrichtigt taeglich ueber neue Artikel von Karim El-Gawhary bei der taz.
    Zum manuellen Debuggen kann das Ereignis taz_author_debug mit date im Format
    YYYY-MM-DD ausgeloest werden.
  triggers:
    - trigger: time
      at: "23:59:00"
      id: schedule
    - trigger: event
      event_type: taz_author_debug
      id: manual
  actions:
    - action: rest_command.taz_karim_el_gawhary
      response_variable: response
    - variables:
        html: "{{ response.content if response.content is string else response.content | string }}"
        articles: >-
          {{ html | regex_findall('(?is)<article\\b[^>]*>(?:(?!</article>).)*?<a\\b(?=[^>]*\\bhref\\s*=\\s*"([^"]+)")(?=[^>]*\\bteaser-link\\b)[^>]*>(?:(?!</article>).)*?<h2\\b[^>]*>(?:(?!</h2>).)*?<span\\b(?=[^>]*\\bis-block\\b)(?=[^>]*\\blink\\b)[^>]*>(.*?)</span>(?:(?!</article>).)*?<time\\b[^>]*\\bdatetime\\s*=\\s*"([^"]+)"') }}
    - repeat:
        for_each: "{{ articles }}"
        sequence:
          - condition: template
            value_template: "{{ repeat.item[2] == check_date }}"
          - action: notify.signal_artikelalarm
            data:
              message: >-
                Neuer Artikel von Karim El-Gawhary, lesenswert:
                {{ repeat.item[1] | regex_replace('<[^>]+>', '') | trim }}
                https://taz.de{{ repeat.item[0] }}
  variables:
    check_date: >-
      {% if trigger.id == 'manual' %}
        {{ trigger.event.data.date | default(now().strftime('%Y-%m-%d'), true) | trim }}
      {% else %}
        {{ now().strftime('%Y-%m-%d') }}
      {% endif %}
  mode: single