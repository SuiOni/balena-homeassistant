- alias: "Apple M5 512GB Memory Availability Monitor"
  description: >-
    Checks whether 512 GB memory appears in Apple's
    configuration API at random intervals of 10–15 minutes.

  triggers:
    - trigger: homeassistant
      event: start

    - trigger: event
      event_type: automation_reloaded

    - trigger: event
      event_type: apple_m5_manual_check

  actions:
    - repeat:
        sequence:
          - variables:
              response: {}

          - action: rest_command.apple_m5_product_check
            response_variable: response
            continue_on_error: true

          - variables:
              memory_options: >-
                {% set content = response.get('content', {}) if response is mapping and response.get('status') == 200 else {} %}
                {% set body = content.get('body', {}) if content is mapping else {} %}
                {% set options = body.get('options', {}) if body is mapping else {} %}
                {% set memory = options.get('memory-dimensionMemory', {}) if options is mapping else {} %}
                {{ memory.get('compatibleOptions', {}) if memory is mapping else {} }}

              memory_512gb_exists: >-
                {{ memory_options is iterable and '512gb' in memory_options }}

          - if:
              - condition: template
                value_template: "{{ memory_512gb_exists | bool }}"
            then:
              - action: notify.signal_artikelalarm
                data:
                  message: >-
                    🤖 Beep boop! 512 GB memory is now listed
                    as an option for the Apple Mac Studio!

                    Check it here:
                    https://www.apple.com/de-business/shop/buy-mac/mac-studio

                    🤖

              - stop: "512 GB memory option detected."

          - delay:
              seconds: "{{ range(600, 901) | random }}"

        until:
          - condition: template
            value_template: "{{ false }}"

  mode: single