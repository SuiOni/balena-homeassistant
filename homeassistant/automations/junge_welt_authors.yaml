alias: Gerhard Hanloser neuer Artikel
description: >-
  Benachrichtigt taeglich ueber neue Artikel von Gerhard Hanloser bei junge
  Welt. Optional kann beim manuellen Ausloesen date im Format DD.MM.YYYY
  uebergeben werden.
triggers:
  - trigger: time
    at: "23:59:00"
actions:
  - action: rest_command.jungewelt_gerhard_hanloser
    response_variable: resp
  - variables:
      html: "{{ resp.content if resp.content is string else resp.content | string }}"
      articles: >-
        {{ html | regex_findall('(?s)<li[^>]+id="a_[^"]+"[^>]*>.*?<div class="text-neutral-400 text-base">([^<]+)</div>.*?<div class="text-3xl[^>]*"><a href="([^"]+)"[^>]*>(.*?)</a>') }}
  - repeat:
      for_each: "{{ articles }}"
      sequence:
        - condition: template
          value_template: "{{ repeat.item[0] | trim == check_date }}"
        - action: notify.signal_artikelalarm
          data:
            message: >-
              Neuer Artikel von Gerhard Hanloser, lesenswert:
              {{ repeat.item[2] | regex_replace('<[^>]+>', '') | trim }}
              https://www.jungewelt.de{{ repeat.item[1] }}
variables:
  check_date: "{{ date | default(now().strftime('%d.%m.%Y'), true) }}"
mode: single
